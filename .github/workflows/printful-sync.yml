# Pulls variant IDs, costs and print sizes from Printful and commits data/printful-variants.json.
# Run it from GitHub → Actions → "Printful sync" → Run workflow. No computer setup needed.
# Needs repo secrets PRINTFUL_API_TOKEN (and PRINTFUL_STORE_ID if your token asks for it).
# For the shipping-email webhook also set secret PRINTFUL_WEBHOOK_SECRET and variable SITE_URL.
name: Printful sync
on:
  workflow_dispatch:
    inputs:
      webhook:
        description: Also register the shipping-email webhook
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync from Printful
        run: npm run printful:sync -- ${{ inputs.webhook && '--webhook' || '' }}
        env:
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
          PRINTFUL_WEBHOOK_SECRET: ${{ secrets.PRINTFUL_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit updated variants
        run: |
          if git diff --quiet data/printful-variants.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/printful-variants.json
          git commit -m "Update Printful variants"
          git push
